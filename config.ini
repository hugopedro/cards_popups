; ====================================================================
; MicroEstudo Overlay - Arquivo de Configuracao
; AVISO: Usar exclusivamente caracteres ASCII neste arquivo INI
; ====================================================================

[Conteudo]
; Nome ou caminho do arquivo Markdown de conteudo de estudo
arquivo=conteudo.md
; Faixa alvo de caracteres para o texto explicativo do card
min_chars=90
max_chars=220
; Porcentagem de cards novos em relacao a cards repetidos para revisao (0-100)
new_ratio=70
; Titulos de secoes para ignorar na extracao (separados por ponto-e-virgula)
ignorar_secoes=Mapeamento das Fontes e Rastreabilidade do Acervo Local;Mapeamento das Fontes

[Exibicao]
; Intervalo entre o inicio de um card e o inicio do proximo (em segundos)
; 300 segundos = 5 minutos
interval_seconds=300
; Tempo de permanencia do card na tela (em segundos)
visible_seconds=30
; Posicionamento: top_right, top_left, bottom_right, bottom_left
corner=top_right
; Margens em pixels a partir da borda do monitor
margin_x=30
margin_y=30
; Dimensoes em pixels logicos
width=440
height=150
; Tamanho da fonte do corpo principal (em pontos: padrao 11, ajustavel)
font_size=11
; Opacidade da janela de 0 (transparente) a 255 (totalmente opaco)
opacity=230
; Cor de fundo da janela em hexadecimal RRGGBB
bg_color=14241F
; Exibir o primeiro card imediatamente ao iniciar o script (1=sim, 0=nao)
show_on_start=1
; Modo de interacao: 0 = Interativo (arrastavel e com botao de lixeira clicavel)
;                   1 = Click-through passivo (cliques passam direto)
click_through=0

[Contexto]
; Lista de nomes de executaveis alvo separados por virgula (ex: Jogo.exe,ACShadows.exe)
; Se vazio, o overlay funcionara sobre qualquer janela ativa
target_exes=
; Ocultar o card se o executavel alvo nao estiver ativo em primeiro plano
hide_when_target_inactive=1

[Estado]
; Gravar e lembrar o progresso dos cards entre sessoes (1=sim, 0=nao)
remember_progress=1
